spring:
  application:
    name: pethome-appointment-service
  datasource:
    url: jdbc:h2:mem:appointmentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8084

# Feign configuration for calling other microservices
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
