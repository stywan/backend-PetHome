spring:
  application:
    name: pethome-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:dbpethome.c58egkiimr78.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:pethome}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:pethome_admin}
    password: ${DB_PASSWORD:0zMGiIYDmCf0g94iS0ex}
  h2:
    console:
      enabled: false
  jpa:
